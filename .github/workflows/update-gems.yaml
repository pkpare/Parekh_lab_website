
name: Update Ruby dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gems:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Update dependencies
        run: |
          bundle update jekyll-last-modified-at

      - name: Commit updated lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Ruby dependency lockfile"
          file_pattern: Gemfile.lock
